name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          if [ -z "$ZIP" ]; then
            echo "ZIP tidak dijumpai"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Project
        run: |
          DIR=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          if [ -z "$DIR" ]; then
            echo "settings.gradle tidak dijumpai"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$DIR")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
